<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agents</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: var(--oc-font); color: var(--oc-fg); }
      #root { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.75rem; }

      .bar { display: flex; align-items: center; gap: 0.5rem; }
      .bar > .grow { flex: 1 1 auto; min-width: 0; }
      .muted { color: var(--oc-muted); font-size: 0.8em; }
      .mono { font-family: var(--oc-mono); }

      .rows { display: flex; flex-direction: column; gap: 0.375rem; }
      .row {
        display: flex; align-items: flex-start; gap: 0.5rem;
        padding: 0.5rem 0.625rem;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius);
        background: var(--oc-elevated);
      }
      .row[data-off="true"] { opacity: 0.6; }
      .row-main {
        flex: 1 1 auto; min-width: 0;
        display: flex; flex-direction: column; gap: 0.1875rem;
        background: none; border: 0; padding: 0; margin: 0;
        font: inherit; color: inherit; text-align: left; cursor: pointer;
      }
      .row-main:hover .row-name { color: var(--oc-primary-text); }
      .row-top { display: flex; align-items: center; gap: 0.375rem; flex-wrap: wrap; }
      .row-name { font-weight: 600; }
      .row-desc {
        color: var(--oc-muted); font-size: 0.8em; line-height: 1.35;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .row-model { color: var(--oc-subtle); font-size: 0.75em; font-family: var(--oc-mono); }
      .row-side { flex: 0 0 auto; padding-top: 0.0625rem; }

      .group-title {
        font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--oc-subtle); margin: 0.25rem 0 0;
      }
      .fields { display: flex; flex-direction: column; gap: 0.625rem; }
      .foot { display: flex; align-items: center; gap: 0.5rem; padding-top: 0.25rem; }
      .foot > .grow { flex: 1 1 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
